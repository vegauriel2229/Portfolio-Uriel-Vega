about:
  paragraphs:
    - id: estudios
      es: "Soy estudiante de la Tecnicatura Universitaria en Programación en la UTN. Estoy en el último semestre y mi egreso estimado es a mediados de 2027."
      en: "I'm a student in the Technical Degree in Programming at UTN, in my final semester, expecting to graduate around mid-2027."
    - id: busqueda
      es: "Busco mi primer empleo en IT, ya sea un puesto full-time, part-time o una pasantía, y estoy abierto a aprender en distintas áreas, no solo desarrollo web. Puedo trabajar en forma remota o presencial desde Godoy Cruz, Mendoza."
      en: "I'm looking for my first job in IT, whether a full-time or part-time position or an internship, and I'm open to learning across different areas, not just web development. I can work remotely or on-site from Godoy Cruz, Mendoza."
    - id: proyectos
      es: "Desarrollé VegaTech, la landing de mi emprendimiento de reparación de celulares, y el sitio institucional de Crisur Polarizados. Además, estoy construyendo un sistema para restaurantes."
      en: "I built VegaTech, the landing page for my phone repair business, and the website for Crisur Polarizados. I'm also building a restaurant ordering system."
    - id: hardware
      es: "Reparo hardware de PC y celulares en mis tiempos libres."
      en: "I repair PC and phone hardware in my free time."
    - id: ia-sdd
      es: "Desarrollo con IA usando agentes: hice un curso y armé mi propio equipo de agentes especializados (requisitos, arquitectura, diseño, desarrollo, QA y seguridad), que orquesto con la metodología SDD."
      en: "AI-assisted development with agents: after taking a course, I built my own team of specialized agents (requirements, architecture, design, development, QA and security) and I orchestrate them using the SDD methodology."
  sddExplanation:
    es: "SDD (Spec-Driven Development) es una forma de trabajar en la que primero se describe por escrito qué se va a construir, y recién después se programa."
    en: "SDD (Spec-Driven Development) is a way of working where you first describe in writing what will be built, and only then write the code."

